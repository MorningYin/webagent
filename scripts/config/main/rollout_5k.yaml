# Production 5k-trajectory rollout: gpt-5.4 policy via yunwu, sealed 5-IP browser proxy.
# Same plumbing as rollout_smoke, scaled up + resumable checkpointing.
defaults:
  - default
  - rollout
  - _self_

save_path: /root/autodl-tmp/webgym_runs/run5k
data_path: /root/autodl-tmp/.cache/huggingface/hub/datasets--microsoft--webgym_tasks/snapshots/a61330203480bea9b90b8e954ecf0b084a114cca

model_config:
  model_type: "qwen3-instruct"
  prompt_version: "complete"

policy_config:
  checkpoint_path: ""
  max_new_tokens: 3072
  temperature: 1
  top_p: 0.99
  api:
    model: "gpt-5.4"            # default model for all stations
    max_retries: 8              # transient retries per call (across stations)
    backoff_cap_sec: 60
    endpoints:                  # multi-station router: budgets combined, auto-failover
      - {name: yunwu,  base_url: "https://yunwu.ai/v1",   api_key_env_var: "POLICY_API_KEY_YUNWU",  weight: 1}
      - {name: newapi, base_url: "https://<NEWAPI_HOST>/v1", api_key_env_var: "POLICY_API_KEY_NEWAPI", weight: 1}

env_config:
  server_size: 20              # 4-instance headroom under 24-instance omnibox -> avoids 503 churn
  max_vllm_sessions: 20        # concurrent gpt-5.4 calls (yunwu has no rate limit)
  host_ip: "localhost"
  master_port: 7000
  cpu_cluster_token_env_var: "CPU_CLUSTER_TOKEN"
  vllm_server_url: "http://localhost:8999"   # unused with policy api
  verbose: false

  split: "train"
  train_tasks: "train.jsonl"
  test_tasks: ""
  train_tasks_rollout_size: 4500   # top-up: ~904 real already collected; sample more fresh
  test_tasks_rollout_size: 0
  test_tasks_repeat_times: 0
  train_tasks_sampler: "uniform"
  deduplicate_across_iterations: true   # don't re-sample task names already attempted (keeps the 904)

  # real step budgets (easy/medium/hard by difficulty 1-3 / 4-6 / 7+)
  train_difficulty_max_steps:
    easy: 10
    medium: 20
    hard: 30
  test_difficulty_max_steps: []

  completion_threshold: 0.95
  completion_grace_period: 30
  save_traj_progress: true     # resumable: incremental checkpoints
  save_every_percent: 5        # bank progress early/often on long runs (was 25)

openai_config:
  model: "gpt-5.4-mini"
  openai_api_key_env_var: "POLICY_API_KEY"
  base_url: "https://yunwu.ai/v1"
  keypoint_detection:
    model: "gpt-5.4-mini"
  blocking_detection:
    model: "gpt-5.4-mini"
  evaluation:
    model: "gpt-5.4-mini"
