# Production 5k-trajectory rollout: gpt-5.4 policy via yunwu, sealed 5-IP browser proxy.
# Same plumbing as rollout_smoke, scaled up + resumable checkpointing.
defaults:
  - default
  - rollout
  - _self_

save_path: /root/autodl-tmp/webgym_runs/run_v2   # fresh dir: new-harness data (old run5k kept for reference)
data_path: /root/autodl-tmp/webgym_runs          # holds tasks_filtered.jsonl

model_config:
  model_type: "qwen3-instruct"
  prompt_version: "complete"

policy_config:
  checkpoint_path: ""
  max_new_tokens: 3072
  temperature: 1
  top_p: 0.99
  api:
    model: "gpt-5.4"            # default model for all stations
    max_retries: 8              # transient retries per call (across stations)
    backoff_cap_sec: 60
    endpoints:                  # multi-station router: weighted RR, auto-failover/cooldown
      # yunwu = fallback only (full price): used solely when all 3 new-api accounts are cooling/down
      - {name: yunwu,   base_url: "https://yunwu.ai/v1",   api_key_env_var: "POLICY_API_KEY_YUNWU",  weight: 1, fallback: true}
      # 3 separate new-api accounts (same gateway, independent RPM) = primary workhorses, even split
      # base_url read from env POLICY_NEWAPI_BASE_URL (keeps the private relay host out of git)
      - {name: newapi,  base_url_env_var: "POLICY_NEWAPI_BASE_URL", api_key_env_var: "POLICY_API_KEY_NEWAPI",  weight: 1}
      - {name: newapi2, base_url_env_var: "POLICY_NEWAPI_BASE_URL", api_key_env_var: "POLICY_API_KEY_NEWAPI2", weight: 1}
      - {name: newapi3, base_url_env_var: "POLICY_NEWAPI_BASE_URL", api_key_env_var: "POLICY_API_KEY_NEWAPI3", weight: 1}

env_config:
  server_size: 50              # 128 destabilized omnibox (503 churn); 50 is stable. CPU was never the limit
  max_vllm_sessions: 50        # concurrent policy calls (spread over 3 new-api primaries + yunwu fallback)
  host_ip: "localhost"
  master_port: 7000
  cpu_cluster_token_env_var: "CPU_CLUSTER_TOKEN"
  vllm_server_url: "http://localhost:8999"   # unused with policy api
  verbose: false

  split: "train"
  train_tasks: "tasks_filtered.jsonl"   # full pool minus 138 env-impossible tasks
  test_tasks: ""
  train_tasks_rollout_size: 5000   # fresh collection under new harness (prompt + 30/50/80 steps + gpt-5.4 judge)
  test_tasks_rollout_size: 0
  test_tasks_repeat_times: 0
  train_tasks_sampler: "uniform"
  deduplicate_across_iterations: false

  # real step budgets (easy/medium/hard by difficulty 1-3 / 4-6 / 7+)
  train_difficulty_max_steps:
    easy: 30
    medium: 50
    hard: 80
  test_difficulty_max_steps: []

  completion_threshold: 0.95
  completion_grace_period: 30
  save_traj_progress: true     # resumable: incremental checkpoints
  save_every_percent: 5        # bank progress early/often on long runs (was 25)

openai_config:
  model: "gpt-5.4-mini"
  openai_api_key_env_var: "POLICY_API_KEY_YUNWU"   # judge upgraded to gpt-5.4 (yunwu)
  base_url: "https://yunwu.ai/v1"
  keypoint_detection:
    model: "gpt-5.4"
  blocking_detection:
    model: "gpt-5.4"
  evaluation:
    model: "gpt-5.4"
